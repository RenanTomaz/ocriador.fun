<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Força Neymar! Rumo à Recuperação</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Background Dinâmico com Transição Suave */
        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('ney1.png');
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            z-index: 1;
        }

        /* Overlay escura para garantir a leitura do painel inferior */
        #bg-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
        }

        /* Banner de Anúncio / Monetização no Topo (Overlay Superior) */
        .ad-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: linear-gradient(180deg, rgba(28,28,28,0.95), rgba(45,45,45,0.85));
            border-bottom: 2px solid #ffdf00;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .ad-placeholder {
            width: 728px;
            height: 90px;
            background: rgba(51, 51, 51, 0.5);
            border: 1px dashed #666;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: #aaa;
        }

        /* Painel de Controle Fixado na Parte Inferior */
        .bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 40px 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.95) 50%, rgba(0,0,0,0.7) 85%, rgba(0,0,0,0) 100%);
            color: #fff;
            text-align: center;
        }

        .meta-box {
            max-width: 750px;
            width: 100%;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Cronômetro */
        #countdown {
            font-size: 15px;
            color: #ffdf00;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        /* Layout Horizontal na parte inferior */
        .interaction-row {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* Barra de Progresso com os Marcadores de Níveis */
        .progress-container {
            background: rgba(40, 40, 40, 0.85);
            border-radius: 20px;
            height: 38px;
            flex-grow: 1;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.5);
        }

        /* A barra interna que vai encher */
        .progress-bar {
            height: 100%;
            width: 0%; /* Cresce de 0% a 100% */
            background: linear-gradient(90deg, #009c3b, #ffdf00);
            border-radius: 20px;
            transition: width 0.6s ease;
        }

        /* Divisores Visuais de Nível (Marcadores a cada 20%) */
        .level-marker {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 3;
        }
        .marker-1 { left: 20%; }
        .marker-2 { left: 40%; }
        .marker-3 { left: 60%; }
        .marker-4 { left: 80%; }

        /* Texto descritivo por cima da barra */
        .progress-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 3px #000;
            z-index: 4;
        }

        /* Botão de Apoio */
        .btn-apoiar {
            background: #ffdf00;
            color: #000;
            border: none;
            padding: 0 35px;
            height: 45px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(255, 223, 0, 0.3);
            transition: transform 0.1s ease, background 0.2s ease;
            z-index: 5;
        }

        .btn-apoiar:hover {
            background: #ffe74c;
            transform: scale(1.03);
        }

        .btn-apoiar:active {
            transform: scale(0.98);
        }

        .btn-apoiar:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Ajustes para Celular */
        @media (max-width: 650px) {
            .interaction-row {
                flex-direction: column;
                gap: 15px;
            }
            .btn-apoiar {
                width: 100%;
                height: 50px;
            }
            .progress-container {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>

    <div class="ad-banner">
        <div class="ad-placeholder">
            [Espaço para Anúncio Monetizado - Banner 728x90]
        </div>
    </div>

    <div class="bottom-panel">
        <div class="meta-box">
            <h1>Operação 12 de Junho: Apoie o Adulto Ney</h1>
            <div id="countdown">Carregando cronômetro...</div>

            <div class="interaction-row">
                <div class="progress-container">
                    <div class="progress-bar" id="myBar"></div>
                    
                    <div class="level-marker marker-1"></div>
                    <div class="level-marker marker-2"></div>
                    <div class="level-marker marker-3"></div>
                    <div class="level-marker marker-4"></div>

                    <div class="progress-text" id="progressPct">Buscando apoios...</div>
                </div>

                <button class="btn-apoiar" id="btnApoiar" onclick="enviarApoio()">Enviar Energia ⚡</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DO SUPABASE
        // Substitua com as credenciais reais do seu projeto do Supabase
        const SUPABASE_URL = 'https://SEU_PROJETO_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'SUA_ANON_KEY_AQUI';
        
        const supabase = bootstrapSupabase();

        function bootstrapSupabase() {
            if (SUPABASE_URL.includes('SEU_PROJETO_ID')) {
                console.warn("Por favor, configure sua URL e API Key do Supabase.");
                return null;
            }
            return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // DEFINIÇÃO DA META DE CLIQUES
        // Defina aqui a quantidade total de cliques para atingir os 100% (Nível 5)
        const metaCliquesTotal = 10000000; // Exemplo: 10 Milhões de cliques/apoios unicos
        let totalApoiosGlobais = 0;
        let ipUsuario = '';

        // Mapeamento exato dos 5 Níveis (Fases da Barra de Progresso)
        // Cada nível ocupa exatamente 20% da meta total
        const niveisMeta = [
            { limitePct: 20,  img: 'ney1.png', nome: 'Nível 1: DM' },
            { limitePct: 40,  img: 'ney2.png', nome: 'Nível 2: Transição' },
            { limitePct: 60,  img: 'ney3.png', nome: 'Nível 3: Academia' },
            { limitePct: 80,  img: 'ney4.png', nome: 'Nível 4: Gramado' },
            { limitePct: 100, img: 'ney5.png', nome: 'Nível 5: Pronto pro Jogo!' }
        ];

        // Obtém o IP público do visitante
        async function obterIp() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                ipUsuario = data.ip;
                verificarSeJaVotou();
            } catch (error) {
                console.error("Erro ao obter IP:", error);
            }
        }

        // Bloqueia o botão caso o IP já tenha participado
        async function verificarSeJaVotou() {
            if (!supabase) return;

            const { data } = await supabase
                .from('cliques_apoio')
                .select('id')
                .eq('ip_address', ipUsuario)
                .maybeSingle();

            if (data) desabilitarBotao();
        }

        // Puxa a contagem total de registros unicos salvos no Supabase
        async function buscarTotalApoios() {
            if (!supabase) {
                // Modo simulação caso o Supabase não esteja conectado ainda
                totalApoiosGlobais = 3500000; // Simula 35% de progresso (Nível 2)
                atualizarInterface();
                return;
            }

            const { count, error } = await supabase
                .from('cliques_apoio')
                .select('*', { count: 'exact', head: true });

            if (!error) {
                totalApoiosGlobais = count;
                atualizarInterface();
            }
        }

        // Controla o preenchimento da barra e a mudança das 5 imagens de fundo
        function atualizarInterface() {
            let porcentagem = (totalApoiosGlobais / metaCliquesTotal) * 100;
            if (porcentagem > 100) porcentagem = 100;

            // Aplica a largura na barra verde/amarela
            document.getElementById('myBar').style.width = porcentagem.toFixed(2) + '%';
            document.getElementById('progressPct').innerText = `${totalApoiosGlobais.toLocaleString('pt-BR')} Apoios (${porcentagem.toFixed(1)}%)`;

            // Lógica de níveis: Altera o background de acordo com o quadrante atingido
            const bgOverlay = document.getElementById('bg-overlay');
            for (let nivel of niveisMeta) {
                if (porcentagem <= nivel.limitePct) {
                    bgOverlay.style.backgroundImage = `url('${nivel.img}')`;
                    break;
                }
            }
        }

        // Envia o voto associando ao IP
        async function enviarApoio() {
            if (!ipUsuario) {
                alert("Identificando sua rede, tente novamente em instantes.");
                return;
            }

            if (!supabase) {
                // Simulação local offline
                totalApoiosGlobais += 1000000; // Pula de nível no clique para teste
                atualizarInterface();
                desabilitarBotao();
                return;
            }

            const { error } = await supabase
                .from('cliques_apoio')
                .insert([{ ip_address: ipUsuario }]);

            if (error) {
                if (error.code === '23505') { 
                    alert("Seu apoio já foi registrado anteriormente!");
                } else {
                    alert("Erro ao computar apoio. Tente novamente.");
                }
                desabilitarBotao();
            } else {
                totalApoiosGlobais++;
                atualizarInterface();
                desabilitarBotao();
            }
        }

        function desabilitarBotao() {
            const btn = document.getElementById('btnApoiar');
            btn.disabled = true;
            btn.innerText = "Energia Enviada! ✔";
        }

        // Cronômetro regressivo até 12 de Junho
        const dataLimite = new Date("June 12, 2026 00:00:00").getTime();

        const x = setInterval(function() {
            const agora = new Date().getTime();
            const distancia = dataLimite - agora;

            const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = `Tempo restante: ${dias}d ${horas}h ${minutos}m ${segundos}s`;

            if (distancia < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "Prazo Encerrado!";
                document.getElementById('btnApoiar').disabled = true;
            }
        }, 1000);

        window.onload = async () => {
            await obterIp();
            await buscarTotalApoios();
            
            // Sincroniza os cliques com o banco a cada 30 segundos
            setInterval(buscarTotalApoios, 30000);
        };
    </script>
</body>
</html>
