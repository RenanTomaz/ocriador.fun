<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constitucional Quest - O Jogo do Conhecimento</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #0f172a;
            --primary-card: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HUD Superior (Heads-Up Display de Jogo) */
        .hud-bar {
            background-color: var(--primary-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--accent-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .hud-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .level-badge {
            background: var(--gold);
            color: var(--primary-dark);
            font-weight: 900;
            padding: 0.5rem 0.8rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .xp-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            width: 150px;
        }

        .xp-text {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-muted);
        }

        .bar-bg {
            background: #334155;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .bar-fill {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .hud-status {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .heart-life {
            color: var(--danger);
            font-size: 1.3rem;
            display: flex;
            gap: 0.25rem;
        }

        .score-box {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-light);
            background: rgba(255,255,255,0.05);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .score-box i {
            color: var(--gold);
            margin-right: 0.5rem;
        }

        /* Layout Principal */
        .game-container {
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex-grow: 1;
        }

        /* Card da Questão Ativa (Estilo Arena) */
        .arena-card {
            background: var(--primary-card);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .arena-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: var(--accent-color);
        }

        .arena-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .topic-tag {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .audio-trigger-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.2s;
        }

        .audio-trigger-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .audio-trigger-btn.playing {
            background: var(--danger);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .question-statement {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        /* Alternativas Gamificadas */
        .gamified-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .gamified-option {
            background: #334155;
            border: 2px solid transparent;
            border-radius: 1rem;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .gamified-option:hover {
            background: #475569;
            transform: translateX(5px);
            border-color: rgba(255,255,255,0.1);
        }

        .option-badge {
            background: var(--primary-dark);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent-color);
            flex-shrink: 0;
        }

        /* Estados de Resposta (Certo/Errado) */
        .gamified-option.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--success) !important;
        }
        .gamified-option.correct .option-badge {
            background: var(--success);
            color: white;
        }

        .gamified-option.wrong {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--danger) !important;
        }
        .gamified-option.wrong .option-badge {
            background: var(--danger);
            color: white;
        }

        .gamified-option.disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        .gamified-option.disabled.correct {
            opacity: 1;
        }

        /* Caixa de Feedback/Explicação Pós-Clique */
        .loot-feedback-box {
            margin-top: 2rem;
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            display: none;
            animation: slideUp 0.4s ease forwards;
        }

        .loot-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .loot-title i {
            color: var(--gold);
        }

        .loot-body {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-muted);
        }

        /* Rodapé de Ações do Jogo */
        .action-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .game-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 0.75rem;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .game-btn:hover {
            background: #475569;
        }

        .game-btn.primary-action {
            background: var(--success);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .game-btn.primary-action:hover {
            background: #059669;
        }

        .orientation-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .orientation-btn:hover {
            color: white;
            border-color: white;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="hud-bar">
        <div class="hud-profile">
            <span class="level-badge">LV 1</span>
            <div class="xp-container">
                <span class="xp-text" id="xpText">XP: 0 / 1000</span>
                <div class="bar-bg"><div class="bar-fill" id="xpFill"></div></div>
            </div>
        </div>

        <button class="orientation-btn" onclick="toggleLandscape()"><i class="fa-solid fa-expand"></i> Tela Horizontal</button>

        <div class="hud-status">
            <div class="score-box"><i class="fa-solid fa-trophy"></i> Pontos: <span id="scoreDisplay">0</span></div>
            <div class="heart-life" id="heartsContainer">
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="arena-card">
            <div class="arena-header">
                <span class="topic-tag" id="cardTopic">Carregando...</span>
                <button class="audio-trigger-btn" id="audioBtn" onclick="controlarNarracaoCompleta()">
                    <i class="fa-solid fa-play" id="audioIcon"></i> Ouvir Missão (Voz)
                </button>
            </div>

            <h2 style="margin-bottom: 0.5rem; font-size: 1.1rem; color: var(--accent-color);" id="questionIndexText">MISSÃO 1 DE 10</h2>
            <div class="question-statement" id="cardStatement">Carregando enunciado...</div>

            <div class="gamified-options" id="optionsContainer">
                </div>

            <div class="loot-feedback-box" id="feedbackBox">
                <div class="loot-title"><i class="fa-solid fa-scroll"></i> Pergaminho do Conhecimento (Por que está certa?)</div>
                <div class="loot-body" id="feedbackText">Explicativo aqui...</div>
            </div>
        </div>

        <div class="action-footer">
            <button class="game-btn" onclick="voltarMissao()" id="btnVoltar" disabled><i class="fa-solid fa-arrow-left"></i> Voltar</button>
            <button class="game-btn primary-action" onclick="avancarMissao()" id="btnAvancar">Próxima Missão <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <script>
        // Banco de Dados das 10 Questões Completas
        const questoesData = [
            {
                id: "Q3656504",
                assunto: "Tratados Internacionais de Direitos Humanos",
                enunciado: "Joaquim, estudante, ficou sabendo que o Brasil deseja ratificar um importante Tratado Internacional sobre Direitos Humanos e descobriu que, de acordo com a Constituição Federal de 1988, referido tratado...",
                alternativas: {
                    a: "será equivalente às emendas constitucionais se for aprovado, em cada Casa do Congresso Nacional, em turno único, por três quintos dos votos dos respectivos membros.",
                    b: "será equivalente às emendas constitucionais se for aprovado, em cada Casa do Congresso Nacional, em turno único, por metade dos votos dos respectivos membros.",
                    c: "será equivalente às emendas constitucionais se for aprovado por maioria simples, em turno único, em apenas uma das Casas do Congresso Nacional, em razão da importância dos direitos humanos no ordenamento jurídico brasileiro.",
                    d: "será equivalente às emendas constitucionais se for aprovado, em cada Casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros.",
                    e: "não poderá ser equivalente às emendas constitucionais, independentemente de qualquer aprovação pelo Congresso Nacional, por expressa vedação constitucional."
                },
                gabarito: "D",
                justificativaCurta: "A alternativa D está correta porque reproduz com perfeição o artigo 5º, parágrafo 3º da Constituição. O rito de equivalência exige dois turnos em ambas as Casas por quórum qualificado de três quintos."
            },
            {
                id: "Q3052709",
                assunto: "Cláusulas Pétreas Expressas",
                enunciado: "Com base nas limitações materiais ao poder de reforma constitucional, assinale a opção que apresenta uma cláusula pétrea expressa no texto do artigo 60 da Constituição Federal de 1988.",
                alternativas: {
                    a: "A independência e autonomia funcional do Ministério Público.",
                    b: "A autonomia administrativa e financeira da Defensoria Pública.",
                    c: "A forma republicana de Governo.",
                    d: "O sistema presidencialista de Governo.",
                    e: "A forma federativa de Estado."
                },
                gabarito: "E",
                justificativaCurta: "A alternativa E está correta. A forma federativa de Estado é uma limitação material explícita listada no artigo 60, parágrafo 4º da Carta Magna, protegida de qualquer abolição."
            },
            {
                id: "Q2372527",
                assunto: "Teoria Geral do Estado e Ideologia Galicana",
                enunciado: "No contexto da formação do Estado Moderno e das relações entre o poder político e o poder religioso, a chamada ideologia ou vertente galicana caracterizou-se por:",
                alternativas: {
                    a: "Defender a submissão total e absoluta do Rei ao poder espiritual do Papa romano.",
                    b: "Sustentar que o poder real emana diretamente de Deus, sem necessidade de intermediários institucionais na Terra.",
                    c: "Consagrar o direito de resistência dos povos perante os monarcas que professassem fé herética.",
                    d: "Afirmar que o poder político deriva de um pacto de submissão familiar e patriarcal imutável.",
                    e: "Pregar a autonomia da Igreja nacional francesa face à autoridade papal, conferindo direitos de controle ao monarca sobre os assuntos eclesiásticos do território."
                },
                gabarito: "E",
                justificativaCurta: "A alternativa E está correta. O galicanismo defendia a autonomia administrativa da Igreja Católica na França, reduzindo o controle do Papa de Roma e dando força política ao monarca francês."
            },
            {
                id: "Q2640036",
                assunto: "Origem do Controle de Constitucionalidade",
                enunciado: "O histórico caso Marbury contra Madison, julgado pela Suprema Corte dos Estados Unidos em 1803, é mundialmente reconhecido por ter consagrado no direito constitucional:",
                alternativas: {
                    a: "A teoria do desvio de poder no ato administrativo.",
                    b: "A origem do controle judicial difuso de constitucionalidade das leis.",
                    c: "O modelo europeu ou austríaco de controle concentrado.",
                    d: "A doutrina da separação absoluta de poderes proposta por Hans Kelsen.",
                    e: "A criação do remédio constitucional do mandado de segurança individual."
                },
                gabarito: "B",
                justificativaCurta: "A alternativa B está correta. O juiz norte-americano John Marshall declarou, pela primeira vez na história moderna, a nulidade judicial de uma lei aprovada pelo parlamento que feria a Constituição, gerando o controle difuso."
            },
            {
                id: "Q2568861",
                assunto: "Equivalência dos Tratados de Direitos Humanos",
                enunciado: "Os tratados e convenções internacionais sobre direitos humanos que forem aprovados, em cada Casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros, serão equivalentes às:",
                alternativas: {
                    a: "Leis Ordinárias.",
                    b: "Leis Complementares.",
                    c: "Leis Delegadas.",
                    d: "Medidas Provisórias.",
                    e: "Emendas Constitucionais."
                },
                gabarito: "E",
                justificativaCurta: "A alternativa E está correta. É a exata consequência formal disposta no art. 5º, § 3º. Esses tratados adentram no topo da pirâmide normativa, igualando-se às Emendas Constitucionais."
            },
            {
                id: "Q2372529",
                assunto: "Mutação Constitucional",
                enunciado: "O fenômeno conhecido como mutação constitucional representa um processo de modificação da Constituição que se caracteriza por:",
                alternativas: {
                    a: "Alterar o sentido e a interpretação da norma sem modificar o seu texto literal.",
                    b: "Declarar a ilegalidade superveniente de emendas promulgadas com vício formal.",
                    c: "Promover a revisão geral do texto constitucional por meio de comissão parlamentar mista exclusiva.",
                    d: "Depender obrigatoriamente da apresentação de proposta de emenda por um terço dos membros da Câmara.",
                    e: "Revogar de forma tácita todas as leis anteriores incompatíveis com uma nova constituição que entra em vigor."
                },
                gabarito: "A",
                justificativaCurta: "A alternativa A está correta. A mutação constitucional altera a interpretação e a abrangência de uma norma por conta da evolução social sem mexer em nenhuma palavra do seu texto formal."
            },
            {
                id: "Q2524970",
                assunto: "Direito Constitucional Intertemporal",
                enunciado: "Quando uma nova Constituição é promulgada e as normas da Constituição anterior que forem materialmente compatíveis com a nova ordem continuam válidas, mas rebaixadas ao status de lei ordinária, ocorre o fenômeno da:",
                alternativas: {
                    a: "Desclassificação normativa.",
                    b: "Desconstitucionalização.",
                    c: "Desidratação constitucional.",
                    d: "Repristinação expressa.",
                    e: "Recepção tácita infraconstitucional."
                },
                gabarito: "B",
                justificativaCurta: "A alternativa B está correta. O rebaixamento hierárquico de uma norma formalmente constitucional da carta antiga para lei comum da nova ordem define tecnicamente a desconstitucionalização."
            },
            {
                id: "Q2634544",
                assunto: "Constitucionalismo Contemporâneo e Crise Democrática",
                enunciado: "O uso de mechanisms e emendas constitucionais formalmente legítimas com o intuito deliberado de minar os pilares democráticos e corroer as instituições de controle por dentro é denominado pela doutrina como:",
                alternativas: {
                    a: "Constitucionalismo pluralista.",
                    b: "Constitucionalismo autoritário originário.",
                    c: "Constitucionalismo abusivo.",
                    d: "Constitucionalismo democrático defensivo.",
                    e: "Constitucionalismo popular radical."
                },
                gabarito: "C",
                justificativaCurta: "A alternativa C está correta. O Constitucionalismo Abusivo se mascara utilizando ferramentas constitucionais e democráticas formais para, de forma sorrateira, corroer e autocratizar o Estado."
            },
            {
                id: "Q2524974",
                assunto: "Classificação do Poder Constituinte",
                enunciado: "O Poder Constituinte Originário costuma ser classificado pela doutrina em Histórico e Revolucionário. Considera-se revolucionário aquele poder que:",
                alternativas: {
                    a: "Edita a primeira constituição de um estado soberano recém-criado.",
                    b: "Promove modificações pontuais no texto da carta por meio de revisões previstas.",
                    c: "Estabelece diretrizes de atuação que ficam subordinadas ao poder instituidor primário.",
                    d: "Estrutura as constituições locais dos estados-membros componentes de uma federação.",
                    e: "Rompe por completo com a ordem jurídica anterior, instituindo uma nova organização estatal."
                },
                gabarito: "E",
                justificativaCurta: "A alternativa E está correta. Enquanto o Histórico ergue a primeiríssima constituição, o Revolucionário rompe e derruba a ordem estabelecida para fundar um arranjo estatal totalmente novo."
            },
            {
                id: "Q1905717",
                assunto: "Limitações Expressas ao Poder de Reforma",
                enunciado: "As limitações expressas impostas ao Poder Constituinte Derivado Reformador na Constituição Federal de 1988 dividem-se classicamente em:",
                alternativas: {
                    a: "Informais, formais e materiais.",
                    b: "Circunstanciais, formais e materiais.",
                    c: "Temporais, circunstanciais e formais.",
                    d: "Imateriais, materiais e procedimentais.",
                    e: "Explícitas, implícitas e decorrentes."
                },
                gabarito: "B",
                justificativaCurta: "A alternativa B está correta. As limitações do artigo 60 se subdividem em Circunstanciais (crises civis), Formais (trâmite exigido por lei) e Materiais (as intocáveis cláusulas pétreas)."
            }
        ];

        // Estado do Jogo (UX Gamificada)
        let indiceAtual = 0;
        let score = 0;
        let vidas = 3;
        let xp = 0;
        let respondidas = {}; // Guarda a alternativa que o usuário clicou para cada índice
        let currentUtterance = null;

        // Elementos de tela
        const cardTopic = document.getElementById('cardTopic');
        const cardStatement = document.getElementById('cardStatement');
        const optionsContainer = document.getElementById('optionsContainer');
        const questionIndexText = document.getElementById('questionIndexText');
        const feedbackBox = document.getElementById('feedbackBox');
        const feedbackText = document.getElementById('feedbackText');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const heartsContainer = document.getElementById('heartsContainer');
        const xpText = document.getElementById('xpText');
        const xpFill = document.getElementById('xpFill');
        const audioIcon = document.getElementById('audioIcon');
        const audioBtn = document.getElementById('audioBtn');
        const btnVoltar = document.getElementById('btnVoltar');
        const btnAvancar = document.getElementById('btnAvancar');

        // Renderizar a Questão Atual da Arena
        function carregarQuestao() {
            window.speechSynthesis.cancel();
            resetBotaoAudio();

            const q = questoesData[indiceAtual];
            
            // Textos básicos
            questionIndexText.innerText = `MISSÃO ${indiceAtual + 1} DE 10 [ID: ${q.id}]`;
            cardTopic.innerText = q.assunto;
            cardStatement.innerText = q.enunciado;

            // Limpar container e renderizar alternativas
            optionsContainer.innerHTML = '';
            feedbackBox.style.display = 'none';

            const jaRespondida = respondidas[indiceAtual] !== undefined;

            for (const [letra, texto] of Object.entries(q.alternativas)) {
                const div = document.createElement('div');
                div.className = 'gamified-option';
                div.innerHTML = `
                    <div class="option-badge">${letra.toUpperCase()}</div>
                    <div style="flex-grow: 1;">${texto}</div>
                `;

                // Controlar estados caso o jogador já tenha clicado antes
                if (jaRespondida) {
                    div.classList.add('disabled');
                    if (letra.toUpperCase() === q.gabarito) {
                        div.classList.add('correct');
                    }
                    if (letra.toUpperCase() === respondidas[indiceAtual] && respondidas[indiceAtual] !== q.gabarito) {
                        div.classList.add('wrong');
                    }
                } else {
                    div.onclick = () => verificarResposta(letra.toUpperCase(), div);
                }

                optionsContainer.appendChild(div);
            }

            // Exibir a caixa de recompensa se já respondeu
            if (jaRespondida) {
                feedbackText.innerText = q.justificativaCurta;
                feedbackBox.style.display = 'block';
            }

            // Atualizar botões de navegação
            btnVoltar.disabled = indiceAtual === 0;
            btnAvancar.innerText = indiceAtual === questoesData.length - 1 ? "Finalizar Jogo 🏆" : "Próxima Missão ➡️";
        }

        // Sistema de Validação Dinâmica com Recompensa (XP/Vidas)
        function verificarResposta(letraEscolhida, elementoClicado) {
            const q = questoesData[indiceAtual];
            respondidas[indiceAtual] = letraEscolhida;

            // Desabilitar todas as opções
            document.querySelectorAll('.gamified-option').forEach(opt => opt.classList.add('disabled'));

            if (letraEscolhida === q.gabarito) {
                // Ganhou pontuação e XP
                elementoClicado.classList.add('correct');
                score += 100;
                xp += 100;
                if (xp >= 1000) xp = 990; // Trava o level 1 para o escopo do teste
                
                scoreDisplay.innerText = score;
                atualizarHUDGamificada();
            } else {
                // Perdeu vida
                elementoClicado.classList.add('wrong');
                vidas--;
                atualizarHUDGamificada();

                // Destacar onde estava a correta
                document.querySelectorAll('.gamified-option').forEach((opt) => {
                    if (opt.querySelector('.option-badge').innerText === q.gabarito) {
                        opt.classList.add('correct');
                    }
                });
            }

            // Revelar pergaminho de conhecimento
            feedbackText.innerText = q.justificativaCurta;
            feedbackBox.style.display = 'block';
        }

        function atualizarHUDGamificada() {
            // Atualizar XP
            xpText.innerText = `XP: ${xp} / 1000`;
            xpFill.style.width = `${(xp / 1000) * 100}%`;

            // Atualizar Corações
            heartsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < vidas) {
                    heartsContainer.innerHTML += `<i class="fa-solid fa-heart"></i>`;
                } else {
                    heartsContainer.innerHTML += `<i class="fa-regular fa-heart" style="color: #475569;"></i>`;
                }
            }

            if (vidas <= 0) {
                setTimeout(() => {
                    alert("⚠️ Suas vidas acabaram! Mas o conhecimento continua. Prossiga para revisar o resto das missões.");
                }, 300);
            }
        }

        // Navegação das missões do RPG
        function avançarMissao() {
            if (indiceAtual < questoesData.length - 1) {
                indiceAtual++;
                carregarQuestao();
            } else {
                alert(`🎮 Fim do Jogo! Você concluiu a campanha com ${score} Pontos de Honra e colheu bastante conhecimento!`);
            }
        }

        function voltarMissao() {
            if (indiceAtual > 0) {
                indiceAtual--;
                carregarQuestao();
            }
        }

        // Sistema de Narração Completo e Realista (Enunciado + Todas as Alternativas)
        function controlarNarracaoCompleta() {
            if (window.speechSynthesis.speaking && currentUtterance) {
                window.speechSynthesis.cancel();
                resetBotaoAudio();
                return;
            }

            const q = questoesData[indiceAtual];
            
            // Montagem do Script da Voz Didática
            let scriptVoz = `Iniciando a Missão número ${indiceAtual + 1}, abordando o tema ${q.assunto}. `;
            scriptVoz += `Ouça com atenção o enunciado da questão: ${q.enunciado} `;
            scriptVoz += `Agora, preste atenção em cada uma das alternativas disponíveis: `;
            
            for (const [letra, texto] of Object.entries(q.alternativas)) {
                scriptVoz += `Alternativa ${letra.toUpperCase()}: ${texto}. `;
            }

            // Se o usuário já respondeu, narra também o porquê
            if (respondidas[indiceAtual] !== undefined) {
                scriptVoz += `Análise de combate concluída. O pergaminho indica que a alternativa certa é a ${q.gabarito}. Justificativa: ${q.justificativaCurta}`;
            } else {
                scriptVoz += `Analise as alternativas em sua arena e escolha sua resposta para ganhar cem pontos de experiência. Boa sorte.`;
            }

            const utterance = new SpeechSynthesisUtterance(scriptVoz);
            
            // Localizar melhor voz em português
            const vozes = window.speechSynthesis.getVoices();
            const vozPt = vozes.find(v => v.lang.includes('PT') || v.lang.includes('pt-BR'));
            if (vozPt) utterance.voice = vozPt;

            utterance.rate = 1.05; // Fluidez
            utterance.pitch = 1.0; 

            utterance.onstart = () => {
                audioIcon.className = 'fa-solid fa-stop';
                audioBtn.classList.add('playing');
                audioBtn.innerHTML = `<i class="fa-solid fa-stop"></i> Parar Narração`;
            };

            utterance.onend = () => {
                resetBotaoAudio();
            };

            currentUtterance = utterance;
            window.speechSynthesis.speak(utterance);
        }

        function resetBotaoAudio() {
            audioIcon.className = 'fa-solid fa-play';
            audioBtn.classList.remove('playing');
            audioBtn.innerHTML = `<i class="fa-solid fa-play"></i> Ouvir Missão (Voz)`;
        }

        // Alternar Rotação Horizontal Nativa/Simulada para UX Mobile
        function toggleLandscape() {
            if (document.documentElement.requestFullscreen) {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().then(() => {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(() => {
                                alert("Por favor, vire seu dispositivo de lado para ativar a visualização horizontal.");
                            });
                        }
                    });
                } else {
                    document.exitFullscreen();
                }
            }
        }

        // Inicializar primeira missão
        window.speechSynthesis.onvoiceschanged = () => {};
        carregarQuestao();
    </script>
</body>
</html>
