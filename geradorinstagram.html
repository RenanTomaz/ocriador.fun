<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Reels Instagram v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: #0f172a; 
            color: white; 
            margin: 0; 
            display: flex; 
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Dinâmica */
        .sidebar { 
            width: 380px; 
            min-width: 380px;
            background: #1e293b; 
            border-right: 1px solid #334155; 
            padding: 20px; 
            overflow-y: auto;
            transition: margin-left 0.3s ease;
            position: relative;
            z-index: 50;
        }

        .sidebar.collapsed {
            margin-left: -380px;
        }

        #toggleBtn {
            position: fixed;
            left: 390px;
            top: 20px;
            z-index: 100;
            background: #3b82f6;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: left 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .sidebar.collapsed + #toggleBtn {
            left: 20px;
        }

        .section-card { 
            background: rgba(15, 23, 42, 0.5); 
            border: 1px solid #475569; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 15px;
        }

        label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 5px; }
        
        input, textarea, select { 
            background: #0f172a !important; 
            border: 1px solid #334155 !important; 
            color: white !important; 
            padding: 10px; 
            border-radius: 8px; 
            width: 100%; 
            font-size: 13px;
            margin-bottom: 10px;
        }

        .preview-area { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 40px;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            overflow: auto;
        }

        /* Mockup Instagram */
        #instagramMockup {
            width: 400px;
            background: white;
            border-radius: 15px;
            padding: 12px 0;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            color: black;
            overflow: hidden;
        }

        .header-post { display: flex; align-items: center; padding: 0 12px 12px 12px; justify-content: space-between; }
        .user-meta { display: flex; align-items: center; gap: 10px; }
        
        .avatar-wrapper {
            width: 42px; height: 42px; background: #f0f0f0;
            border-radius: 50%; overflow: hidden; border: 1px solid #dbdbdb;
            display: flex; align-items: center; justify-content: center;
        }
        .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .media-container {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #fafafa;
            position: relative;
            overflow: hidden;
            background-image: linear-gradient(45deg, #efefef 25%, transparent 25%), 
                              linear-gradient(-45deg, #efefef 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #efefef 75%), 
                              linear-gradient(-45deg, transparent 75%, #efefef 75%);
            background-size: 20px 20px;
        }

        #mediaRender { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 10; }

        .post-actions { padding: 12px; display: flex; justify-content: space-between; }
        .footer-content { padding: 0 12px 12px 12px; }
        
        .format-reels { aspect-ratio: 9/16 !important; }
        .mockup-reels { width: 340px !important; }

        .btn-action {
            background: #3b82f6; color: white; padding: 12px; border-radius: 8px;
            font-weight: 700; text-align: center; cursor: pointer;
            text-transform: uppercase; font-size: 11px; transition: 0.3s;
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="mb-6">
            <h1 class="text-xl font-black italic">FERRAMENTAS<span class="text-blue-500">PRO</span></h1>
        </div>
        
        <div class="section-card">
            <label>👤 Perfil</label>
            <input type="file" id="userFile" accept="image/*" onchange="loadAvatar(event)">
            <input type="text" id="inUser" value="seu_usuario" oninput="sync()">
            <input type="text" id="inLoc" value="Localização" oninput="sync()">
        </div>

        <div class="section-card">
            <label>🎬 Mídia (Vídeo ou Foto)</label>
            <input type="file" id="mediaFile" accept="video/*,image/*" onchange="loadMedia(event)">
            <select id="inFormat" onchange="changeFormat()">
                <option value="square">Quadrado (1:1)</option>
                <option value="reels">Vertical (9:16)</option>
            </select>
        </div>

        <div class="section-card">
            <label>✍️ Legenda</label>
            <input type="text" id="inStats" value="1.234 visualizações" oninput="sync()">
            <textarea id="inCap" rows="3" oninput="sync()">Legenda do seu post aqui...</textarea>
        </div>

        <button class="btn-action w-full bg-emerald-600 hover:bg-emerald-500" onclick="downloadContent()">Baixar Foto (PNG)</button>
    </aside>

    <div id="toggleBtn" onclick="toggleMenu()">
        <span id="toggleIcon">◀</span>
    </div>

    <main class="preview-area">
        <div id="instagramMockup">
            <div class="header-post">
                <div class="user-meta">
                    <div class="avatar-wrapper" id="avatarBox">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ccc"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <div class="user-text-info">
                        <div class="font-bold text-[14px] flex items-center gap-1">
                            <span id="outUser">seu_usuario</span>
                            <svg width="12" height="12" viewBox="0 0 40 40"><path d="M19.9999 0L23.4701 2.21351L27.4631 1.10449L29.6106 4.54478L33.6496 4.88147L34.5446 8.8228L38.1633 10.6106L37.5259 14.5828L40 17.7611L37.8687 21.213L38.9955 25.1769L35.7194 27.6106L35.2139 31.642L31.3323 32.8811L29.3516 36.4172L25.4093 36.1423L22.25 38.8955L18.5299 37.7865L14.5369 38.8955L12.3894 35.4552L8.35037 35.1185L7.4554 31.1772L3.83669 29.3894L4.47408 25.4172L2 22.2389L4.13127 18.787L3.00448 14.8231L6.2806 12.3894L6.78609 8.35804L10.6677 7.11892L12.6484 3.58283L16.5907 3.85768L19.75 1.10449L19.9999 0Z" fill="#0095F6"/><path d="M18.125 26.25L11.25 19.375L13.125 17.5L18.125 22.5L26.875 13.75L28.75 15.625L18.125 26.25Z" fill="white"/></svg>
                        </div>
                        <div class="text-[12px] text-gray-500" id="outLoc">Localização</div>
                    </div>
                </div>
            </div>

            <div class="media-container" id="mediaBox">
                <!-- A mídia será inserida aqui -->
            </div>

            <div class="post-actions">
                <div class="flex gap-4">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </div>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </div>

            <div class="footer-content text-black">
                <div class="font-bold text-[14px] mb-1" id="outStats">1.234 visualizações</div>
                <div class="text-[14px]">
                    <b id="outUserCap">seu_usuario</b> <span id="outCap">Legenda do seu post aqui...</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('toggleIcon');
            sidebar.classList.toggle('collapsed');
            icon.innerText = sidebar.classList.contains('collapsed') ? "▶" : "◀";
        }

        function sync() {
            const user = document.getElementById('inUser').value;
            document.getElementById('outUser').innerText = user;
            document.getElementById('outUserCap').innerText = user;
            document.getElementById('outLoc').innerText = document.getElementById('inLoc').value;
            document.getElementById('outStats').innerText = document.getElementById('inStats').value;
            document.getElementById('outCap').innerText = document.getElementById('inCap').value;
        }

        function loadAvatar(event) {
            const box = document.getElementById('avatarBox');
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => box.innerHTML = `<img src="${e.target.result}">`;
                reader.readAsDataURL(file);
            }
        }

        function loadMedia(event) {
            const mediaBox = document.getElementById('mediaBox');
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    mediaBox.innerHTML = ''; // Limpa a área
                    if (file.type.startsWith('video/')) {
                        const video = document.createElement('video');
                        video.id = 'mediaRender';
                        video.src = e.target.result;
                        video.autoplay = true;
                        video.muted = true;
                        video.loop = true;
                        mediaBox.appendChild(video);
                    } else {
                        const img = document.createElement('img');
                        img.id = 'mediaRender';
                        img.src = e.target.result;
                        mediaBox.appendChild(img);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function changeFormat() {
            const format = document.getElementById('inFormat').value;
            const mediaBox = document.getElementById('mediaBox');
            const mockup = document.getElementById('instagramMockup');
            if (format === 'reels') {
                mediaBox.classList.add('format-reels');
                mockup.classList.add('mockup-reels');
            } else {
                mediaBox.classList.remove('format-reels');
                mockup.classList.remove('mockup-reels');
            }
        }

        async function downloadContent() {
            const mockup = document.getElementById('instagramMockup');
            const canvas = await html2canvas(mockup, { scale: 2, useCORS: true });
            const link = document.createElement('a');
            link.download = 'instagram-preview.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
