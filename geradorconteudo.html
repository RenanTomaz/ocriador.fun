<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador FerramentasPro v5.0 - 9 Templates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,900;1,900&display=swap');
        
        :root { --bg-dark: #010411; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; }

        .viewport-container {
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            overflow: auto; height: 100vh; flex: 1;
            background: radial-gradient(circle at center, #0f172a 0%, #010411 100%);
        }

        /* Container do Post */
        #instagramPreview {
            width: 1080px; height: 1080px; min-width: 1080px;
            position: relative; overflow: hidden; background-color: #020617;
            border-radius: 20px; transform: scale(0.35); transform-origin: top center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8); transition: all 0.5s ease-in-out;
        }

        @media (min-width: 768px) { #instagramPreview { transform: scale(0.5); } }

        /* Estilos Comuns */
        #matrixBackground { position: absolute; inset: 0; font-family: monospace; font-size: 20px; color: #1e293b; opacity: 0.3; line-height: 1.2; z-index: 1; }
        .fp-title { font-size: 60px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; line-height: 1; }
        #photoFrame { position: absolute; z-index: 10; overflow: hidden; border: 10px solid #fff; transition: all 0.5s ease; }
        #previewPhoto { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }
        #contentArea { position: absolute; z-index: 20; transition: all 0.5s ease; }

        /* --- CONFIGURAÇÃO DOS 9 TEMPLATES --- */
        
        /* 1. Clássico (O que já tínhamos) */
        .tpl-1 #photoFrame { top: 200px; right: 80px; width: 450px; height: 600px; border-radius: 200px 30px 200px 30px; }
        .tpl-1 #contentArea { top: 320px; left: 80px; width: 500px; }

        /* 2. Split Vertical (Texto em cima, Foto embaixo) */
        .tpl-2 #photoFrame { bottom: 0; left: 0; width: 1080px; height: 500px; border: none; border-radius: 0; }
        .tpl-2 #contentArea { top: 180px; left: 80px; width: 920px; text-align: center; }
        .tpl-2 #viewLargeTitle { font-size: 110px; }

        /* 3. Foco na Foto (Círculo Central) */
        .tpl-3 #photoFrame { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 700px; height: 700px; border-radius: 50%; border-width: 20px; }
        .tpl-3 #contentArea { bottom: 80px; left: 0; width: 1080px; text-align: center; background: rgba(2,6,23,0.8); padding: 40px 0; }

        /* 4. Minimalista Dark (Sem Foto, Apenas Texto Gigante) */
        .tpl-4 #photoFrame { display: none; }
        .tpl-4 #contentArea { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 900px; text-align: left; }
        .tpl-4 #viewLargeTitle { font-size: 140px; border-left: 15px solid #3b82f6; padding-left: 40px; }

        /* 5. Diagonal (Corte inclinado) */
        .tpl-5 #photoFrame { top: -100px; right: -100px; width: 700px; height: 1200px; transform: rotate(15deg); border-radius: 80px; }
        .tpl-5 #contentArea { bottom: 150px; left: 80px; width: 600px; }

        /* 6. Card Superior (Estilo App) */
        .tpl-6 #photoFrame { top: 80px; left: 80px; width: 920px; height: 400px; border-radius: 40px; }
        .tpl-6 #contentArea { top: 520px; left: 80px; width: 920px; }
        .tpl-6 #viewLargeTitle { color: #3b82f6; }

        /* 7. Revista (Texto sobreposto lateral) */
        .tpl-7 #photoFrame { top: 0; left: 0; width: 600px; height: 1080px; border: none; border-radius: 0; }
        .tpl-7 #contentArea { top: 200px; right: 80px; width: 450px; text-align: right; }

        /* 8. Impacto (Centralizado com moldura quadrada) */
        .tpl-8 #photoFrame { top: 150px; left: 150px; width: 780px; height: 500px; border-radius: 20px; }
        .tpl-8 #contentArea { bottom: 150px; left: 150px; width: 780px; text-align: center; }

        /* 9. Tech Grid (Estilo Dashboard) */
        .tpl-9 #photoFrame { bottom: 150px; right: 80px; width: 350px; height: 350px; border-radius: 50% 0 50% 50%; }
        .tpl-9 #contentArea { top: 250px; left: 80px; width: 800px; }
        .tpl-9 #viewLargeTitle { font-size: 110px; text-shadow: 10px 10px 0px #3b82f6; }

        /* Inputs */
        input, textarea, select { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; padding: 10px !important; border-radius: 8px !important; width: 100%; }
        .slide-tab { transition: all 0.2s; cursor: pointer; }
        .slide-tab.active { background-color: #3b82f6; color: white; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

    <aside class="w-full md:w-[450px] bg-slate-900 p-6 overflow-y-auto border-r border-slate-800 z-50">
        <div class="mb-6 flex justify-between items-center">
            <div class="fp-title text-2xl">Ferramentas<span class="text-blue-500">Pro</span></div>
            <button onclick="addSlide()" class="bg-blue-600 px-3 py-2 rounded-lg text-xs font-bold">+ Slide</button>
        </div>

        <div id="slideTabs" class="flex gap-2 overflow-x-auto pb-4 mb-6"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Escolher Layout (Template)</label>
                <select id="selTemplate" onchange="updateCurrentSlideData()">
                    <option value="tpl-1">01. Clássico Orgânico</option>
                    <option value="tpl-2">02. Split Vertical</option>
                    <option value="tpl-3">03. Círculo Central</option>
                    <option value="tpl-4">04. Minimalista (Só Texto)</option>
                    <option value="tpl-5">05. Diagonal Tech</option>
                    <option value="tpl-6">06. Estilo Aplicativo</option>
                    <option value="tpl-7">07. Estilo Revista</option>
                    <option value="tpl-8">08. Moldura Central</option>
                    <option value="tpl-9">09. Grid Dashboard</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Cor do Tema</label>
                <select id="gradTheme" onchange="updateCurrentSlideData()">
                    <option value="from-blue-600 to-blue-800">Azul</option>
                    <option value="from-emerald-600 to-emerald-800">Verde</option>
                    <option value="from-indigo-600 to-indigo-800">Índigo</option>
                    <option value="from-orange-600 to-orange-800">Laranja</option>
                    <option value="from-rose-600 to-rose-800">Rosa</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Foto</label>
                <input type="file" id="inPhoto" accept="image/*">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Título</label>
                <input type="text" id="inLargeTitle" oninput="updateCurrentSlideData()">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Conteúdo</label>
                <textarea id="inSmallTitle" rows="3" oninput="updateCurrentSlideData()"></textarea>
            </div>

            <button onclick="downloadPNG()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase tracking-widest text-xs mt-4">Download PNG</button>
            <button onclick="deleteSlide()" id="btnDelete" class="w-full text-red-500 text-[10px] uppercase font-bold mt-2">Excluir Slide</button>
        </div>
    </aside>

    <main class="viewport-container">
        <div id="instagramPreview" class="tpl-1">
            <div id="matrixBackground"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#020617] z-[2]"></div>
            
            <header class="absolute top-16 left-20 z-[30]">
                <div class="fp-title text-[50px]">Ferramentas<span class="text-blue-500">Pro</span></div>
            </header>

            <div id="contentArea">
                <h2 id="viewLargeTitle" class="text-[90px] font-black italic leading-[0.9] uppercase tracking-tighter"></h2>
                <p id="viewSmallTitle" class="mt-8 text-2xl text-slate-300 font-medium leading-relaxed"></p>
            </div>

            <div id="photoFrame">
                <img id="previewPhoto" src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=600">
                <div id="photoGradOverlay" class="absolute inset-0 opacity-60 bg-gradient-to-br"></div>
            </div>

            <footer class="absolute bottom-16 left-20 right-20 flex justify-between items-center z-[30] border-t border-white/10 pt-8">
                <span class="text-2xl font-bold text-slate-500 tracking-[0.3em]">WWW.FERRAMENTASPRO.NET</span>
                <span id="viewPagination" class="text-4xl font-black text-blue-500"></span>
            </footer>
        </div>
    </main>

    <script>
        let slides = [{
            title: "JUROS COMPOSTOS",
            subtitle: "O guia definitivo para fazer o dinheiro trabalhar por você.",
            theme: "from-blue-600 to-blue-800",
            template: "tpl-1",
            image: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=600"
        }];
        let currentSlideIndex = 0;

        function init() {
            const matrix = document.getElementById('matrixBackground');
            matrix.innerText = Array.from({length: 4000}, () => Math.floor(Math.random() * 10)).join('');
            renderTabs();
            loadSlide(0);
        }

        function renderTabs() {
            const container = document.getElementById('slideTabs');
            container.innerHTML = '';
            slides.forEach((_, index) => {
                const btn = document.createElement('div');
                btn.className = `slide-tab min-w-[50px] h-[40px] flex items-center justify-center rounded-lg border border-slate-700 font-bold text-xs ${index === currentSlideIndex ? 'active' : 'bg-slate-800 text-slate-500'}`;
                btn.innerText = (index + 1).toString().padStart(2, '0');
                btn.onclick = () => loadSlide(index);
                container.appendChild(btn);
            });
        }

        function loadSlide(index) {
            currentSlideIndex = index;
            const data = slides[index];
            document.getElementById('inLargeTitle').value = data.title;
            document.getElementById('inSmallTitle').value = data.subtitle;
            document.getElementById('gradTheme').value = data.theme;
            document.getElementById('selTemplate').value = data.template;
            document.getElementById('previewPhoto').src = data.image;
            renderTabs();
            updatePreviewUI();
        }

        function addSlide() {
            slides.push({...slides[currentSlideIndex]});
            loadSlide(slides.length - 1);
        }

        function deleteSlide() {
            if(slides.length <= 1) return;
            slides.splice(currentSlideIndex, 1);
            currentSlideIndex = Math.max(0, currentSlideIndex - 1);
            loadSlide(currentSlideIndex);
        }

        function updateCurrentSlideData() {
            const s = slides[currentSlideIndex];
            s.title = document.getElementById('inLargeTitle').value;
            s.subtitle = document.getElementById('inSmallTitle').value;
            s.theme = document.getElementById('gradTheme').value;
            s.template = document.getElementById('selTemplate').value;
            updatePreviewUI();
        }

        function updatePreviewUI() {
            const data = slides[currentSlideIndex];
            const preview = document.getElementById('instagramPreview');
            preview.className = data.template;
            document.getElementById('viewLargeTitle').innerText = data.title;
            document.getElementById('viewSmallTitle').innerText = data.subtitle;
            document.getElementById('viewPagination').innerText = `${(currentSlideIndex + 1).toString().padStart(2, '0')}/${slides.length.toString().padStart(2, '0')}`;
            document.getElementById('photoGradOverlay').className = "absolute inset-0 opacity-60 bg-gradient-to-br " + data.theme;
        }

        document.getElementById('inPhoto').onchange = function(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('previewPhoto').src = ev.target.result;
                slides[currentSlideIndex].image = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function downloadPNG() {
            const node = document.getElementById('instagramPreview');
            const scale = node.style.transform;
            node.style.transform = "none";
            html2canvas(node, { scale: 2, backgroundColor: "#020617", useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `slide-${currentSlideIndex+1}.png`;
                link.href = canvas.toDataURL();
                link.click();
                node.style.transform = scale;
            });
        }

        init();
    </script>
</body>
</html>
