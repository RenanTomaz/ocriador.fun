<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerramentasPro AI Engine v7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,900;1,900&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #010411; color: white; margin: 0; overflow: hidden; }
        
        /* Layout */
        .sidebar { width: 420px; background: #0f172a; border-right: 1px solid #1e293b; height: 100vh; overflow-y: auto; padding: 24px; z-index: 50; }
        .preview-area { flex: 1; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px; background: radial-gradient(circle at center, #1e293b 0%, #010411 100%); overflow: auto; }

        /* Preview Card */
        #instagramPreview { 
            width: 1080px; height: 1080px; min-width: 1080px; position: relative; overflow: hidden; 
            background: #020617; border-radius: 20px; transform: scale(0.45); transform-origin: top center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8); transition: all 0.5s ease;
        }

        /* Elementos Visuais */
        #matrixBackground { position: absolute; inset: 0; font-family: monospace; font-size: 20px; color: #1e293b; opacity: 0.3; line-height: 1.2; z-index: 1; }
        .fp-title { font-size: 60px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; line-height: 1; }
        #photoFrame { position: absolute; z-index: 10; overflow: hidden; border: 10px solid #fff; transition: all 0.5s ease; }
        #previewPhoto { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }

        /* UI de Controles */
        .section-card { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
        label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; display: block; }
        input, textarea, select { background: #020617 !important; border: 1px solid #334155 !important; color: white !important; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 12px; font-size: 13px; }
        
        .slide-tab { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #334155; cursor: pointer; font-weight: 900; background: #020617; color: #475569; }
        .slide-tab.active { background: #3b82f6; color: white; border-color: #60a5fa; }

        /* Templates Posicionamento */
        .tpl-1 #photoFrame { top: 200px; right: 80px; width: 450px; height: 600px; border-radius: 200px 30px 200px 30px; }
        .tpl-1 #contentArea { top: 320px; left: 80px; width: 500px; }
        .tpl-2 #photoFrame { bottom: 0; left: 0; width: 1080px; height: 500px; border: none; }
        .tpl-2 #contentArea { top: 180px; left: 80px; width: 920px; text-align: center; }
        .tpl-4 #photoFrame { display: none; }
        .tpl-4 #contentArea { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 850px; text-align: center; }
        .tpl-8 #photoFrame { top: 150px; left: 150px; width: 780px; height: 500px; border-radius: 20px; }
        .tpl-8 #contentArea { bottom: 150px; left: 150px; width: 780px; text-align: center; }

        /* Loading */
        #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="flex">

    <div id="loadingOverlay">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500 mb-4"></div>
        <p class="font-bold tracking-widest uppercase text-xs">Gemini está roteirizando...</p>
    </div>

    <aside class="sidebar">
        <header class="mb-8">
            <div class="fp-title text-2xl">Ferramentas<span class="text-blue-500">Pro</span></div>
            <p class="text-[9px] text-slate-500 uppercase font-bold tracking-[0.2em]">AI Generation Engine v7.0</p>
        </header>

        <div class="section-card border-blue-500/50 bg-blue-950/20">
            <label class="text-blue-400">1. Configuração da IA</label>
            <input type="password" id="apiKey" placeholder="AIzaSyBwcVUq1MkAx5cRFU8SmCOzPh5q8PR8fQs">
            
            <label class="text-blue-400">2. Assunto do Carrossel</label>
            <input type="text" id="aiTopic" placeholder="Ex: Por que calcular o ROI do marketing?">
            
            <button onclick="generateWithAI()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-lg uppercase text-[10px] tracking-widest transition-all">
                ✨ Gerar Roteiro com Gemini
            </button>
        </div>

        <div class="section-card">
            <label>Navegação Manual</label>
            <div id="slideTabs" class="flex gap-2 overflow-x-auto pb-2 mb-4"></div>

            <label>Template do Slide</label>
            <select id="selTemplate" onchange="updateData()">
                <option value="tpl-1">Template 01: Clássico</option>
                <option value="tpl-2">Template 02: Split</option>
                <option value="tpl-4">Template 04: Minimalista (Foco Texto)</option>
                <option value="tpl-8">Template 08: Moldura Central</option>
            </select>

            <label>Título</label>
            <input type="text" id="inLargeTitle" oninput="updateData()">

            <label>Conteúdo</label>
            <textarea id="inSmallTitle" rows="3" oninput="updateData()"></textarea>

            <label>Foto de Fundo</label>
            <input type="file" id="inPhoto" accept="image/*">
        </div>

        <button onclick="downloadPNG()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl uppercase tracking-widest text-xs shadow-lg mb-4">
            Descargar PNG (High Res)
        </button>
        
        <button onclick="addSlide()" class="w-full border border-slate-700 text-slate-400 font-bold py-2 rounded-lg text-[10px] uppercase">
            + Adicionar Slide Vazio
        </button>
    </aside>

    <main class="preview-area">
        <div id="instagramPreview" class="tpl-1">
            <div id="matrixBackground"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#020617] z-[2]"></div>
            
            <header class="absolute top-16 left-20 z-[30]">
                <div class="fp-title text-[50px]">Ferramentas<span class="text-blue-500">Pro</span></div>
            </header>

            <div id="contentArea" class="absolute z-[30]">
                <h2 id="viewLargeTitle" class="text-[90px] font-black italic leading-[0.85] uppercase tracking-tighter"></h2>
                <p id="viewSmallTitle" class="mt-8 text-2xl text-slate-300 font-medium leading-relaxed"></p>
            </div>

            <div id="photoFrame">
                <img id="previewPhoto" src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=600">
                <div id="photoGradOverlay" class="absolute inset-0 opacity-60 bg-gradient-to-br from-blue-600 to-blue-800"></div>
            </div>

            <footer class="absolute bottom-16 left-20 right-20 flex justify-between items-center z-[30] border-t border-white/10 pt-8">
                <span class="text-2xl font-bold text-slate-500 tracking-[0.3em]">WWW.FERRAMENTASPRO.NET</span>
                <span id="viewPagination" class="text-4xl font-black text-blue-500"></span>
            </footer>
        </div>
    </main>

    <script>
        let slides = [{ 
            title: "AGUARDANDO IA", 
            subtitle: "Insira um assunto e clique em gerar para criar o conteúdo automaticamente.", 
            template: "tpl-1",
            image: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=600"
        }];
        let currentSlideIndex = 0;

        // FUNÇÃO GERADORA COM GEMINI
        async function generateWithAI() {
            const key = document.getElementById('apiKey').value;
            const topic = document.getElementById('aiTopic').value;

            if(!key || !topic) return alert("Por favor, insira a Chave da API e o Assunto.");

            document.getElementById('loadingOverlay').style.display = 'flex';

            const systemPrompt = `Você é um copywriter financeiro. Crie um carrossel de 5 slides para o Instagram sobre o assunto: "${topic}".
            Regras:
            - Slide 1: Gancho de curiosidade.
            - Slide 2: Explicação do problema.
            - Slide 3: Detalhe técnico/educativo.
            - Slide 4: Exemplo prático de cálculo.
            - Slide 5: Chamada para ação (CTA) para o site ferramentaspro.net.
            - Títulos devem ter no máximo 4 palavras. 
            - Conteúdos devem ter no máximo 100 caracteres.
            - Retorne APENAS um formato JSON puro, sem markdown, contendo um array de objetos com as chaves: "title" e "subtitle".`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                });

                const data = await response.json();
                const textResponse = data.candidates[0].content.parts[0].text;
                const cleanJson = textResponse.replace(/```json|```/g, "").trim();
                const parsedSlides = JSON.parse(cleanJson);

                // Mapeia os dados da IA para nossos slides mantendo templates variados
                slides = parsedSlides.map((s, i) => ({
                    title: s.title.toUpperCase(),
                    subtitle: s.subtitle,
                    template: i === 0 ? "tpl-1" : (i === 4 ? "tpl-8" : "tpl-2"),
                    image: slides[0].image // Mantém a imagem atual ou padrão
                }));

                currentSlideIndex = 0;
                renderTabs();
            } catch (err) {
                console.error(err);
                alert("Erro ao gerar conteúdo. Verifique sua chave ou o limite da API.");
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // LÓGICA DO EDITOR
        function renderTabs() {
            const container = document.getElementById('slideTabs');
            container.innerHTML = '';
            slides.forEach((_, i) => {
                const b = document.createElement('div');
                b.className = `slide-tab ${i === currentSlideIndex ? 'active' : ''}`;
                b.innerText = (i + 1).toString().padStart(2, '0');
                b.onclick = () => { currentSlideIndex = i; loadSlide(); };
                container.appendChild(b);
            });
            loadSlide();
        }

        function loadSlide() {
            const s = slides[currentSlideIndex];
            document.getElementById('inLargeTitle').value = s.title;
            document.getElementById('inSmallTitle').value = s.subtitle;
            document.getElementById('selTemplate').value = s.template;
            document.getElementById('previewPhoto').src = s.image;
            updatePreviewUI();
        }

        function updateData() {
            const s = slides[currentSlideIndex];
            s.title = document.getElementById('inLargeTitle').value;
            s.subtitle = document.getElementById('inSmallTitle').value;
            s.template = document.getElementById('selTemplate').value;
            updatePreviewUI();
        }

        function updatePreviewUI() {
            const s = slides[currentSlideIndex];
            document.getElementById('instagramPreview').className = s.template;
            document.getElementById('viewLargeTitle').innerText = s.title;
            document.getElementById('viewSmallTitle').innerText = s.subtitle;
            document.getElementById('viewPagination').innerText = `${(currentSlideIndex + 1).toString().padStart(2, '0')}/${slides.length.toString().padStart(2, '0')}`;
        }

        function addSlide() {
            slides.push({ title: "NOVO SLIDE", subtitle: "Conteúdo...", template: "tpl-1", image: slides[0].image });
            currentSlideIndex = slides.length - 1;
            renderTabs();
        }

        function downloadPNG() {
            const node = document.getElementById('instagramPreview');
            const originalScale = node.style.transform;
            node.style.transform = "none";
            html2canvas(node, { scale: 2, backgroundColor: "#020617" }).then(canvas => {
                const link = document.createElement('a');
                link.download = `post-${currentSlideIndex+1}.png`;
                link.href = canvas.toDataURL();
                link.click();
                node.style.transform = originalScale;
            });
        }

        // Setup Inicial
        const matrix = document.getElementById('matrixBackground');
        matrix.innerText = Array.from({length: 4000}, () => Math.floor(Math.random() * 10)).join('');
        renderTabs();
    </script>
</body>
</html>
