<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerramentasPro - Gerador de Conteúdo v16.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,900;1,900&display=swap');
        
        body { font-family: 'Poppins', sans-serif; background: #010411; color: white; margin: 0; overflow: hidden; display: flex; }
        
        .sidebar { 
            width: 380px; min-width: 380px; background: #0f172a; 
            border-right: 1px solid #1e293b; height: 100vh; overflow-y: auto; 
            padding: 20px; z-index: 50; transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .sidebar.collapsed { margin-left: -380px; }

        #toggleSidebarBtn {
            position: fixed; top: 20px; left: 20px; z-index: 100;
            background: #3b82f6; color: white; border-radius: 8px;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s;
        }

        /* Área de Preview sem gradientes para evitar bugs visual no download */
        .preview-area { 
            flex: 1; height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: #010411; 
            overflow: hidden; padding: 20px; transition: 0.4s;
        }

        #canvasWrapper { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }

        #instagramPreview { 
            width: 1080px; height: 1080px; min-width: 1080px; position: relative; 
            overflow: hidden; background: #020617; border-radius: 0;
            transform-origin: center;
            /* Removido box-shadow complexo que causava faixas de cores */
            border: 1px solid rgba(255,255,255,0.05); 
        }

        .fp-title { font-size: 55px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; line-height: 1; }
        
        /* PhotoFrame Totalmente Sólido */
        #photoFrame { 
            position: absolute; 
            z-index: 10; 
            overflow: hidden; 
            background: #ffffff; /* Cor 100% sólida */
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex;
            align-items: center;
            justify-content: center;
            border: none; /* Removido qualquer borda ou pontilhado */
        }

        #contentArea { 
            position: absolute; 
            z-index: 30; 
            display: flex; 
            flex-direction: column; 
            transition: all 0.5s ease; 
        }
        
        #viewLargeTitle { 
            font-weight: 900; font-style: italic; text-transform: uppercase; 
            line-height: 1.1; letter-spacing: -0.04em; margin-bottom: 30px;
            white-space: pre-wrap; display: block;
        }

        #viewSmallTitle { font-weight: 500; white-space: pre-wrap; display: block; }

        .section-card { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; padding: 14px; border-radius: 12px; margin-bottom: 15px; }
        label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; display: block; }
        input, textarea, select { background: #020617 !important; border: 1px solid #334155 !important; color: white !important; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 8px; font-size: 12px; }
        
        input[type="color"] { padding: 2px; height: 40px; cursor: pointer; border: none !important; }

        .slide-tab { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #334155; cursor: pointer; font-weight: 900; background: #020617; color: #94a3b8; transition: 0.3s; }
        .slide-tab.active { background: #3b82f6 !important; color: white !important; border-color: #60a5fa; transform: scale(1.1); }

        /* Templates */
        .tpl-1 #photoFrame { top: 100px; right: 100px; width: 520px; height: 520px; border-radius: 50% 50% 50% 10px; }
        .tpl-1 #contentArea { top: 660px; left: 80px; width: 920px; text-align: left; align-items: flex-start; }
        .tpl-2 #photoFrame { top: 0; left: 0; width: 1080px; height: 480px; border-radius: 0; }
        .tpl-2 #contentArea { top: 580px; left: 80px; width: 920px; text-align: left; align-items: flex-start; }
        .tpl-3 #photoFrame { bottom: 100px; left: 80px; width: 450px; height: 900px; border-radius: 30px; }
        .tpl-3 #contentArea { top: 150px; right: 80px; width: 500px; text-align: left; align-items: flex-end; }
        .tpl-4 #photoFrame { display: none; }
        .tpl-4 #contentArea { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 920px; text-align: center; align-items: center; }
        .tpl-5 #photoFrame { top: 150px; left: 150px; width: 780px; height: 400px; border-radius: 20px; }
        .tpl-5 #contentArea { bottom: 150px; left: 150px; width: 780px; text-align: center; align-items: center; }
        .tpl-6 #photoFrame { top: 0; right: 0; width: 540px; height: 1080px; border-radius: 0; }
        .tpl-6 #contentArea { top: 300px; left: 80px; width: 420px; text-align: left; align-items: flex-start; }
        .tpl-7 #photoFrame { top: 120px; left: 50%; transform: translateX(-50%); width: 400px; height: 400px; border-radius: 50%; }
        .tpl-7 #contentArea { top: 550px; left: 50%; transform: translateX(-50%); width: 900px; text-align: center; align-items: center; }
        .tpl-8 #photoFrame { top: 120px; left: 80px; width: 920px; height: 500px; border-radius: 20px; }
        .tpl-8 #contentArea { bottom: 120px; left: 80px; width: 920px; text-align: center; align-items: center; }
        .tpl-9 #photoFrame { bottom: 80px; right: 80px; width: 400px; height: 600px; border-radius: 50% 10% 50% 10%; }
        .tpl-9 #contentArea { top: 120px; left: 80px; width: 800px; text-align: left; align-items: flex-start; }
        .tpl-10 #photoFrame { top: 0; left: 0; width: 1080px; height: 1080px; border: none; }
        .tpl-10 #contentArea { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 900px; text-align: center; align-items: center; }

        #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="toggleSidebarBtn" onclick="toggleSidebar()">
        <span id="toggleIcon">◀</span>
    </div>

    <div id="loadingOverlay">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500 mb-4"></div>
        <p class="font-bold tracking-widest uppercase text-xs text-blue-400">Processando...</p>
    </div>

    <aside class="sidebar" id="sidebar">
        <header class="mb-6 pt-10">
            <div class="fp-title text-xl">Ferramentas<span class="text-blue-500">Pro</span></div>
            <p class="text-[8px] text-slate-500 uppercase font-bold tracking-widest">Gerador de conteúdo</p>
        </header>

        <div class="section-card border-amber-500/30 bg-amber-950/10">
            <label class="text-amber-400">🔑 API KEY GROK</label>
            <input type="password" id="apiKeyManual" placeholder="gsk_...">
        </div>

        <div class="section-card border-emerald-500/30 bg-emerald-900/10">
            <label class="text-emerald-400">✨ Assunto</label>
            <input type="text" id="aiTopic" placeholder="Digite aqui o assunto">
            <button onclick="generateWithAI()" class="w-full bg-emerald-600 font-black py-2 rounded-lg uppercase text-[10px] tracking-widest hover:bg-emerald-500">Gerar conteúdo</button>
        </div>

        <div class="section-card">
            <label>Navegação</label>
            <div id="slideTabs" class="flex flex-wrap gap-2 mb-4"></div>
            <div class="flex gap-2">
                <button onclick="addSlide()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded text-[10px] font-bold uppercase">+</button>
                <button onclick="removeSlide()" class="flex-1 bg-red-900/50 hover:bg-red-800 py-2 rounded text-[10px] font-bold uppercase">-</button>
            </div>
        </div>

        <div class="section-card">
            <label>🎨 Cores do Slide (Sólidas)</label>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label>Fundo</label>
                    <input type="color" id="bgColorPicker" value="#020617" oninput="updateData()">
                </div>
                <div>
                    <label>Textos</label>
                    <input type="color" id="textColorPicker" value="#ffffff" oninput="updateData()">
                </div>
            </div>
        </div>

        <div class="section-card">
            <label>Editor de Layout</label>
            <label>Escolha o Template</label>
            <select id="selTemplate" onchange="updateData()">
                <option value="tpl-1">01. Capa Circular</option>
                <option value="tpl-2">02. Banner Superior</option>
                <option value="tpl-3">03. Destaque Lateral</option>
                <option value="tpl-4">04. Texto Centralizado</option>
                <option value="tpl-5">05. Quadrado Minimalista</option>
                <option value="tpl-6">06. Divisão Vertical</option>
                <option value="tpl-7">07. Perfil de Impacto</option>
                <option value="tpl-8">08. Faixa Inferior</option>
                <option value="tpl-9">09. Estilo Revista</option>
                <option value="tpl-10">10. Full Background</option>
            </select>

            <label>Título (Aceita Enter)</label>
            <textarea id="inLargeTitle" rows="3" oninput="updateData()" placeholder="Título do slide"></textarea>
            
            <label>Resumo (Aceita Enter)</label>
            <textarea id="inSmallTitle" rows="3" oninput="updateData()" placeholder="Texto do slide"></textarea>
        </div>

        <button onclick="downloadPNG()" class="w-full bg-blue-600 font-black py-4 rounded-xl uppercase text-xs mb-4 hover:bg-blue-500">Baixar PNG (1080px)</button>
    </aside>

    <main class="preview-area" id="previewArea">
        <div id="canvasWrapper">
            <div id="instagramPreview" class="tpl-1">
                <header class="absolute top-10 left-20 z-[30]">
                    <div class="fp-title text-[30px]" id="brandingText">Ferramentas<span class="text-blue-500">Pro</span></div>
                </header>

                <div id="contentArea">
                    <h2 id="viewLargeTitle" class="italic"></h2>
                    <p id="viewSmallTitle" class="text-2xl font-medium"></p>
                </div>

                <div id="photoFrame"></div>

                <footer class="absolute bottom-12 left-20 right-20 flex justify-between items-center z-[30] border-t border-white/10 pt-8" id="slideFooter">
                    <span class="text-xl font-bold tracking-[0.2em]" id="siteUrl">WWW.FERRAMENTASPRO.NET</span>
                    <span id="viewPagination" class="text-4xl font-black"></span>
                </footer>
            </div>
        </div>
    </main>

    <script>
        let slides = Array.from({length: 5}, (_, i) => ({
            title: i === 0 ? "TÍTULO" : `INSIRA O TÍTULO ${i+1}`,
            subtitle: "Insira aqui o seu texto.",
            template: `tpl-${(i % 10) + 1}`,
            bgColor: "#020617",
            textColor: "#ffffff"
        }));
        
        let currentSlideIndex = 0;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('toggleIcon');
            sidebar.classList.toggle('collapsed');
            icon.innerText = sidebar.classList.contains('collapsed') ? "▶" : "◀";
            setTimeout(resizer, 400);
        }

        function resizer() {
            const wrapper = document.getElementById('canvasWrapper');
            const preview = document.getElementById('instagramPreview');
            const scale = Math.min((wrapper.offsetWidth - 40) / 1080, (wrapper.offsetHeight - 40) / 1080);
            preview.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizer);
        setTimeout(resizer, 100);

        function renderTabs() {
            const container = document.getElementById('slideTabs');
            container.innerHTML = '';
            slides.forEach((_, i) => {
                const btn = document.createElement('div');
                btn.className = `slide-tab ${i === currentSlideIndex ? 'active' : ''}`;
                btn.innerText = (i + 1).toString().padStart(2, '0');
                btn.onclick = () => { currentSlideIndex = i; loadSlide(); renderTabs(); };
                container.appendChild(btn);
            });
        }

        function addSlide() {
            slides.push({...slides[slides.length-1], title: "NOVO SLIDE"});
            currentSlideIndex = slides.length - 1;
            renderTabs(); loadSlide();
        }

        function removeSlide() {
            if(slides.length <= 1) return;
            slides.splice(currentSlideIndex, 1);
            currentSlideIndex = Math.max(0, currentSlideIndex - 1);
            renderTabs(); loadSlide();
        }

        function loadSlide() {
            const s = slides[currentSlideIndex];
            document.getElementById('inLargeTitle').value = s.title;
            document.getElementById('inSmallTitle').value = s.subtitle;
            document.getElementById('selTemplate').value = s.template;
            document.getElementById('bgColorPicker').value = s.bgColor;
            document.getElementById('textColorPicker').value = s.textColor;
            updatePreviewUI();
        }

        function updateData() {
            const s = slides[currentSlideIndex];
            s.title = document.getElementById('inLargeTitle').value.toUpperCase();
            s.subtitle = document.getElementById('inSmallTitle').value;
            s.template = document.getElementById('selTemplate').value;
            s.bgColor = document.getElementById('bgColorPicker').value;
            s.textColor = document.getElementById('textColorPicker').value;
            updatePreviewUI();
        }

        function updatePreviewUI() {
            const s = slides[currentSlideIndex];
            const preview = document.getElementById('instagramPreview');
            const titleEl = document.getElementById('viewLargeTitle');
            const subEl = document.getElementById('viewSmallTitle');
            const pag = document.getElementById('viewPagination');
            const branding = document.getElementById('brandingText');
            const footer = document.getElementById('slideFooter');
            const url = document.getElementById('siteUrl');
            
            // Forçar Cor Sólida de Fundo
            preview.style.backgroundColor = s.bgColor;
            
            // Forçar Cor Sólida do Texto
            titleEl.style.color = s.textColor;
            subEl.style.color = s.textColor;
            branding.style.color = s.textColor;
            pag.style.color = s.textColor;
            url.style.color = s.textColor;
            url.style.opacity = "0.5";
            footer.style.borderTopColor = s.textColor + "33";

            preview.className = s.template;
            titleEl.innerText = s.title;
            subEl.innerText = s.subtitle;
            pag.innerText = `${(currentSlideIndex + 1).toString().padStart(2, '0')}/${slides.length.toString().padStart(2, '0')}`;

            let size = s.template === 'tpl-4' || s.template === 'tpl-10' ? 120 : 85;
            if(s.title.length > 20) size -= 15;
            if(s.title.length > 40) size -= 15;
            titleEl.style.fontSize = size + 'px';
        }

        async function generateWithAI() {
            const key = document.getElementById('apiKeyManual').value;
            const topic = document.getElementById('aiTopic').value;
            if(!key || !topic) return alert("Dados insuficientes!");
            
            document.getElementById('loadingOverlay').style.display = 'flex';
            const prompt = `Gere carrossel de 5 slides sobre "${topic}". JSON: {"slides": [{"title": "TITULO", "subtitle": "RESUMO"}]}`;

            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({ 
                        model: "llama-3.3-70b-versatile", 
                        messages: [{role: "user", content: prompt}],
                        response_format: { type: "json_object" }
                    })
                });
                const data = await res.json();
                const content = JSON.parse(data.choices[0].message.content).slides;
                
                slides = content.map((s, i) => ({
                    title: s.title.toUpperCase(),
                    subtitle: s.subtitle,
                    template: `tpl-${(i % 10) + 1}`,
                    bgColor: document.getElementById('bgColorPicker').value,
                    textColor: document.getElementById('textColorPicker').value
                }));
                currentSlideIndex = 0;
                renderTabs(); loadSlide();
            } catch (e) { alert("Erro na API."); }
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function downloadPNG() {
            const node = document.getElementById('instagramPreview');
            const originalTransform = node.style.transform;
            node.style.transform = "none";
            
            // Configurações do html2canvas para evitar bugs de transparência e gradientes
            html2canvas(node, { 
                scale: 2, 
                backgroundColor: null, // Deixa o CSS do elemento mandar
                useCORS: true,
                logging: false,
                width: 1080,
                height: 1080,
                onclone: (clonedDoc) => {
                    // Garante que o fundo do clone seja sólido antes da captura
                    const clonedPreview = clonedDoc.getElementById('instagramPreview');
                    clonedPreview.style.boxShadow = "none";
                }
            }).then(canvas => {
                const a = document.createElement('a');
                a.download = `slide-${currentSlideIndex+1}.png`;
                a.href = canvas.toDataURL("image/png");
                a.click();
                node.style.transform = originalTransform;
            });
        }

        renderTabs(); loadSlide();
    </script>
</body>
</html>
