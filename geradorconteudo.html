<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador FerramentasPro v3.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,900;1,900&display=swap');
        
        :root { --bg-dark: #010411; --accent: #3b82f6; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; }

        /* Estilização da área de Preview para garantir visibilidade */
        .viewport-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            overflow: auto;
            height: calc(100vh - 80px);
            background: radial-gradient(circle at center, #0f172a 0%, #010411 100%);
        }

        #instagramPreview {
            width: 1080px;
            height: 1080px;
            min-width: 1080px; /* Impede que o flexbox esmague o card */
            position: relative;
            overflow: hidden;
            background-color: #020617;
            border-radius: 20px;
            /* Zoom para visualização no editor */
            transform: scale(0.5); 
            transform-origin: top center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        /* Elementos Visuais Estilo Site v2.7 */
        #matrixBackground {
            position: absolute;
            inset: 0; font-family: monospace; font-size: 20px;
            color: #1e293b; opacity: 0.3; line-height: 1.2; z-index: 1;
        }

        .fp-title {
            font-size: 70px; font-weight: 900; font-style: italic;
            text-transform: uppercase; letter-spacing: -0.05em; line-height: 1;
        }

        #photoFrame {
            position: absolute; top: 200px; right: 80px;
            width: 450px; height: 600px; z-index: 10;
            overflow: hidden; border-radius: 200px 30px 200px 30px;
            border: 10px solid #fff;
        }

        /* Ajustes de inputs */
        input, textarea, select {
            background: #1e293b !important;
            border: 1px solid #334155 !important;
            color: white !important;
            padding: 10px !important;
            border-radius: 8px !important;
            width: 100%;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

    <aside class="w-full md:w-[400px] bg-slate-900 p-6 overflow-y-auto border-r border-slate-800 shadow-2xl z-50">
        <div class="mb-8">
            <div class="fp-title text-2xl">Ferramentas<span class="text-blue-500">Pro</span></div>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest">Gerador de Posts v3.5</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Cor do Tema</label>
                <select id="gradTheme">
                    <option value="from-blue-600 to-blue-800">Azul (Juros/ROI)</option>
                    <option value="from-emerald-600 to-emerald-800">Verde (Salário/Lucro)</option>
                    <option value="from-indigo-600 to-indigo-800">Índigo (13º/Comissão)</option>
                    <option value="from-orange-600 to-orange-800">Laranja (Horas Extras)</option>
                    <option value="from-rose-600 to-rose-800">Rosa (Parcelamento)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Imagem de Fundo</label>
                <input type="file" id="inPhoto" accept="image/*">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Título Principal</label>
                <input type="text" id="inLargeTitle" value="JUROS COMPOSTOS">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Subtítulo</label>
                <textarea id="inSmallTitle" rows="2">O guia definitivo para fazer o dinheiro trabalhar por você.</textarea>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Slide</label>
                    <input type="number" id="inCurrent" value="1">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Total</label>
                    <input type="number" id="inTotal" value="5">
                </div>
            </div>

            <div class="pt-4 space-y-2">
                <button onclick="downloadPNG()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all uppercase tracking-widest text-xs shadow-lg shadow-blue-900/20">
                    Descargar PNG (Alta Res)
                </button>
                <p class="text-[10px] text-slate-500 text-center">A imagem será salva em 2160x2160px (Ultra HD)</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 viewport-container">
        <div id="instagramPreview">
            <div id="matrixBackground"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#020617] z-[2]"></div>
            
            <header class="absolute top-16 left-20 z-10">
                <div class="fp-title">Ferramentas<span class="text-blue-500">Pro</span></div>
                <div class="h-2 w-48 bg-blue-500 rounded-full mt-2"></div>
            </header>

            <div class="absolute top-[320px] left-20 w-[500px] z-20">
                <h2 id="viewLargeTitle" class="text-[90px] font-black italic leading-[0.9] uppercase tracking-tighter"></h2>
                <p id="viewSmallTitle" class="mt-8 text-2xl text-slate-300 font-medium leading-relaxed"></p>
            </div>

            <div id="photoFrame">
                <img id="previewPhoto" src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=600" class="w-full h-full object-cover grayscale">
                <div id="photoGradOverlay" class="absolute inset-0 opacity-60 bg-gradient-to-br"></div>
            </div>

            <footer class="absolute bottom-16 left-20 right-20 flex justify-between items-center z-10 border-t border-white/10 pt-8">
                <span class="text-2xl font-bold text-slate-500 tracking-[0.3em]">WWW.FERRAMENTASPRO.NET</span>
                <span id="viewPagination" class="text-4xl font-black text-blue-500"></span>
            </footer>
        </div>
    </main>

    <script>
        // Preenche o fundo com números aleatórios
        const matrix = document.getElementById('matrixBackground');
        matrix.innerText = Array.from({length: 4000}, () => Math.floor(Math.random() * 10)).join('');

        function update() {
            document.getElementById('viewLargeTitle').innerText = document.getElementById('inLargeTitle').value;
            document.getElementById('viewSmallTitle').innerText = document.getElementById('inSmallTitle').value;
            
            const current = document.getElementById('inCurrent').value.padStart(2, '0');
            const total = document.getElementById('inTotal').value.padStart(2, '0');
            document.getElementById('viewPagination').innerText = `${current}/${total}`;

            const theme = document.getElementById('gradTheme').value;
            const overlay = document.getElementById('photoGradOverlay');
            overlay.className = "absolute inset-0 opacity-60 bg-gradient-to-br " + theme;
        }

        // Upload de foto
        document.getElementById('inPhoto').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (event) => document.getElementById('previewPhoto').src = event.target.result;
            reader.readAsDataURL(e.target.files[0]);
        });

        // Download PNG
        function downloadPNG() {
            const node = document.getElementById('instagramPreview');
            const originalTransform = node.style.transform;
            
            // Remove o zoom para capturar em tamanho real
            node.style.transform = "none";
            
            html2canvas(node, {
                scale: 2, // Dobra a resolução para 2160px
                backgroundColor: "#020617",
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `post-ferramentaspro-${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                node.style.transform = originalTransform; // Restaura o zoom na tela
            });
        }

        // Escuta todos os inputs para atualizar em tempo real
        document.querySelectorAll('input, textarea, select').forEach(el => el.oninput = update);
        update(); // Inicia o estado inicial
    </script>
</body>
</html>
