<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerramentasPro AI - Auto-Image v12.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,900;1,900&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #010411; color: white; margin: 0; overflow: hidden; display: flex; }
        .sidebar { width: 380px; min-width: 380px; background: #0f172a; border-right: 1px solid #1e293b; height: 100vh; overflow-y: auto; padding: 20px; transition: all 0.4s ease; position: relative; z-index: 50; }
        .sidebar.hidden-menu { margin-left: -380px; opacity: 0; }
        #toggleMenu { position: fixed; top: 20px; left: 20px; z-index: 100; background: #3b82f6; color: white; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .preview-area { flex: 1; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 50px 20px; background: radial-gradient(circle at center, #1e293b 0%, #010411 100%); overflow: auto; }
        #instagramPreview { width: 1080px; height: 1080px; min-width: 1080px; position: relative; overflow: hidden; background: #020617; border-radius: 0px; transform: scale(0.42); transform-origin: top center; box-shadow: 0 40px 100px rgba(0,0,0,0.8); }
        .blob { position: absolute; z-index: 2; opacity: 0.6; pointer-events: none; }
        .blob-1 { width: 900px; height: 900px; top: -300px; left: -300px; background: radial-gradient(circle, rgba(59,130,246,0.5) 0%, rgba(59,130,246,0) 70%); }
        .blob-2 { width: 800px; height: 800px; bottom: -200px; right: -200px; background: radial-gradient(circle, rgba(8,145,178,0.4) 0%, rgba(8,145,178,0) 70%); }
        #matrixBackground { position: absolute; inset: 0; font-family: monospace; font-size: 22px; color: #1e293b; opacity: 0.25; line-height: 1.1; z-index: 1; word-break: break-all; }
        .fp-title { font-size: 55px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; line-height: 1; }
        #photoFrame { position: absolute; z-index: 10; overflow: hidden; border: 12px solid #fff; transition: all 0.5s ease; box-shadow: 0 30px 60px rgba(0,0,0,0.5); background: #111; }
        #previewPhoto { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; }
        #contentArea { position: absolute; z-index: 30; transition: all 0.3s ease; word-wrap: break-word; }
        #viewLargeTitle { font-weight: 900; font-style: italic; text-transform: uppercase; line-height: 1.1; letter-spacing: -0.04em; padding-bottom: 10px; }
        #viewSmallTitle { font-weight: 500; line-height: 1.4; color: #cbd5e1; }
        .section-card { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; padding: 14px; border-radius: 12px; margin-bottom: 15px; }
        label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; display: block; }
        input, textarea, select { background: #020617 !important; border: 1px solid #334155 !important; color: white !important; padding: 8px; border-radius: 8px; width: 100%; margin-bottom: 8px; font-size: 13px; }
        .slide-tab { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #334155; cursor: pointer; font-weight: 900; background: #020617; color: #475569; transition: all 0.3s; flex-shrink: 0; }
        .slide-tab.active { background: #3b82f6; color: white; }
        .tpl-1 #photoFrame { top: 100px; right: 100px; width: 520px; height: 520px; border-radius: 50% 50% 50% 10px; }
        .tpl-1 #contentArea { top: 660px; left: 80px; width: 920px; padding-right: 40px; }
        .tpl-2 #photoFrame { top: 0; left: 0; width: 1080px; height: 480px; border: none; border-radius: 0; }
        .tpl-2 #contentArea { top: 540px; left: 80px; width: 920px; }
        .tpl-4 #photoFrame { display: none; }
        .tpl-4 #contentArea { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 920px; text-align: center; }
        #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500 mb-4"></div>
        <p class="font-bold tracking-widest uppercase text-xs text-blue-400">Criando Conteúdo e Buscando Imagens...</p>
    </div>

    <div id="toggleMenu" onclick="toggleSidebar()"><span>☰</span></div>

    <aside class="sidebar" id="sidebar">
        <header class="mb-6 pt-10">
            <div class="fp-title text-xl">Ferramentas<span class="text-blue-500">Pro</span></div>
            <p class="text-[8px] text-slate-500 uppercase font-bold tracking-widest">Auto-Image Station v12.0</p>
        </header>

        <div class="section-card border-amber-500/50 bg-amber-950/10">
            <label class="text-amber-400">🔑 Chave Groq</label>
            <input type="password" id="apiKeyManual" placeholder="gsk_...">
        </div>

        <div class="section-card border-emerald-500/50 bg-emerald-900/10">
            <label class="text-emerald-400">✨ Gerar Tudo com IA</label>
            <input type="text" id="aiTopic" placeholder="Tema (ex: Juros Compostos)">
            <button onclick="generateWithAI()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-lg uppercase text-[10px] tracking-widest transition-all">🚀 Criar Post Completo</button>
        </div>

        <div class="section-card">
            <label>Navegador de Slides</label>
            <div id="slideTabs" class="flex gap-2 overflow-x-auto pb-2 mb-4"></div>
            <label>Estilo do Slide</label>
            <select id="selTemplate" onchange="updateData()">
                <option value="tpl-1">Capa Clássica</option>
                <option value="tpl-2">Split Explicativo</option>
                <option value="tpl-4">Texto de Impacto</option>
            </select>
            <label>Título</label>
            <input type="text" id="inLargeTitle" oninput="updateData()">
            <label>Legenda</label>
            <textarea id="inSmallTitle" rows="3" oninput="updateData()"></textarea>
            <label>Trocar Foto</label>
            <input type="file" id="inPhoto" accept="image/*">
        </div>

        <button onclick="downloadPNG()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl uppercase text-xs shadow-lg">Baixar Slide Atual</button>
    </aside>

    <main class="preview-area">
        <div id="instagramPreview" class="tpl-1">
            <div id="matrixBackground"></div>
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <header class="absolute top-16 left-20 z-[30]"><div class="fp-title text-[50px]">Ferramentas<span class="text-blue-500">Pro</span></div></header>
            <div id="contentArea"><h2 id="viewLargeTitle"></h2><p id="viewSmallTitle" class="mt-12 text-2xl"></p></div>
            <div id="photoFrame">
                <img id="previewPhoto" crossorigin="anonymous" src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800">
                <div id="photoGradOverlay" class="absolute inset-0 opacity-40 bg-gradient-to-br from-blue-600 to-cyan-500"></div>
            </div>
            <footer class="absolute bottom-12 left-20 right-20 flex justify-between items-center z-[30] border-t border-white/10 pt-8">
                <span class="text-xl font-bold text-slate-500 tracking-[0.2em]">WWW.FERRAMENTASPRO.NET</span>
                <span id="viewPagination" class="text-4xl font-black text-blue-500"></span>
            </footer>
        </div>
    </main>

    <script>
        let slides = [{ 
            title: "AUTO-IMAGE ATIVO", 
            subtitle: "Agora a IA busca imagens relacionadas ao seu tema automaticamente.", 
            template: "tpl-1", 
            image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800" 
        }];
        let currentSlideIndex = 0;

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hidden-menu'); }

        async function generateWithAI() {
            const key = document.getElementById('apiKeyManual').value;
            const topic = document.getElementById('aiTopic').value;
            if(!key.startsWith('gsk_')) return alert("Insira uma chave Groq válida!");
            if(!topic) return alert("Digite um assunto!");
            
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // PROMPT OTIMIZADO PARA GERAR KEYWORD DE IMAGEM
            const prompt = `Crie um carrossel de 5 slides sobre "${topic}". 
            Retorne um JSON: {"slides": [{"title": "TITULO", "subtitle": "CONTEUDO", "keyword": "uma_palavra_em_ingles_sobre_o_assunto"}]}.
            Ex: se o assunto é juros, use keyword "finance". Se é trabalho, use "office".`;

            try {
                const res = await fetch(`https://api.groq.com/openai/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({ 
                        model: "llama-3.3-70b-versatile", 
                        messages: [{role: "user", content: prompt}], 
                        temperature: 0.6,
                        response_format: { type: "json_object" } 
                    })
                });
                const data = await res.json();
                const content = JSON.parse(data.choices[0].message.content);
                const rawSlides = content.slides || content;

                slides = rawSlides.map((s, i) => ({
                    title: s.title.toUpperCase(),
                    subtitle: s.subtitle,
                    template: i === 0 ? "tpl-1" : (i === 4 ? "tpl-4" : "tpl-2"),
                    // BUSCA IMAGEM AUTOMÁTICA BASEADA NA KEYWORD
                    image: `https://loremflickr.com/1080/1080/${s.keyword || 'business'}?lock=${Math.floor(Math.random()*1000)}`
                }));
                currentSlideIndex = 0;
                renderTabs();
            } catch (e) { alert("Erro na geração."); } 
            finally { document.getElementById('loadingOverlay').style.display = 'none'; }
        }

        function renderTabs() {
            const container = document.getElementById('slideTabs');
            container.innerHTML = '';
            slides.forEach((_, i) => {
                const btn = document.createElement('div');
                btn.className = `slide-tab ${i === currentSlideIndex ? 'active' : ''}`;
                btn.innerText = (i + 1).toString().padStart(2, '0');
                btn.onclick = () => { currentSlideIndex = i; renderTabs(); loadSlide(); };
                container.appendChild(btn);
            });
            loadSlide();
        }

        function loadSlide() {
            const s = slides[currentSlideIndex];
            document.getElementById('inLargeTitle').value = s.title;
            document.getElementById('inSmallTitle').value = s.subtitle;
            document.getElementById('selTemplate').value = s.template;
            document.getElementById('previewPhoto').src = s.image;
            updatePreviewUI();
        }

        function updateData() {
            const s = slides[currentSlideIndex];
            s.title = document.getElementById('inLargeTitle').value;
            s.subtitle = document.getElementById('inSmallTitle').value;
            s.template = document.getElementById('selTemplate').value;
            updatePreviewUI();
        }

        function updatePreviewUI() {
            const s = slides[currentSlideIndex];
            const titleEl = document.getElementById('viewLargeTitle');
            const subEl = document.getElementById('viewSmallTitle');
            const preview = document.getElementById('instagramPreview');
            preview.className = s.template;
            titleEl.innerText = s.title;
            subEl.innerText = s.subtitle;

            let titleSize = s.template === 'tpl-4' ? 120 : 85;
            if (s.title.length > 20) titleSize = s.template === 'tpl-4' ? 80 : 65;
            if (s.title.length > 40) titleSize = s.template === 'tpl-4' ? 60 : 50;
            titleEl.style.fontSize = titleSize + 'px';
            
            document.getElementById('viewPagination').innerText = `${(currentSlideIndex + 1).toString().padStart(2, '0')}/${slides.length.toString().padStart(2, '0')}`;
        }

        document.getElementById('inPhoto').onchange = (e) => {
            const r = new FileReader();
            r.onload = (ev) => { 
                document.getElementById('previewPhoto').src = ev.target.result; 
                slides[currentSlideIndex].image = ev.target.result; 
            };
            r.readAsDataURL(e.target.files[0]);
        };

        function downloadPNG() {
            const node = document.getElementById('instagramPreview');
            const originalTransform = node.style.transform;
            node.style.transform = "none";
            html2canvas(node, { scale: 2, backgroundColor: "#020617", useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `slide-${currentSlideIndex+1}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                node.style.transform = originalTransform;
            });
        }

        document.getElementById('matrixBackground').innerText = Array.from({length: 4000}, () => Math.floor(Math.random() * 10)).join('');
        renderTabs();
    </script>
</body>
</html>
