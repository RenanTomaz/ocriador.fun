<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador FerramentasPro v4.0 - Multi-Slides</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,900;1,900&display=swap');
        
        :root { --bg-dark: #010411; --accent: #3b82f6; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; }

        .viewport-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow: auto;
            height: calc(100vh - 0px);
            background: radial-gradient(circle at center, #0f172a 0%, #010411 100%);
            flex: 1;
        }

        #instagramPreview {
            width: 1080px;
            height: 1080px;
            min-width: 1080px;
            position: relative;
            overflow: hidden;
            background-color: #020617;
            border-radius: 20px;
            transform: scale(0.35); 
            transform-origin: top center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            transition: transform 0.3s ease;
        }

        @media (min-width: 768px) {
            #instagramPreview { transform: scale(0.5); }
        }

        #matrixBackground {
            position: absolute;
            inset: 0; font-family: monospace; font-size: 20px;
            color: #1e293b; opacity: 0.3; line-height: 1.2; z-index: 1;
        }

        .fp-title {
            font-size: 70px; font-weight: 900; font-style: italic;
            text-transform: uppercase; letter-spacing: -0.05em; line-height: 1;
        }

        #photoFrame {
            position: absolute; top: 200px; right: 80px;
            width: 450px; height: 600px; z-index: 10;
            overflow: hidden; border-radius: 200px 30px 200px 30px;
            border: 10px solid #fff;
        }

        input, textarea, select {
            background: #1e293b !important;
            border: 1px solid #334155 !important;
            color: white !important;
            padding: 10px !important;
            border-radius: 8px !important;
            width: 100%;
        }

        .slide-tab {
            transition: all 0.2s;
            cursor: pointer;
        }
        .slide-tab.active {
            background-color: #3b82f6;
            border-color: #60a5fa;
            color: white;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

    <aside class="w-full md:w-[450px] bg-slate-900 p-6 overflow-y-auto border-r border-slate-800 shadow-2xl z-50">
        <div class="mb-6 flex justify-between items-center">
            <div>
                <div class="fp-title text-2xl">Ferramentas<span class="text-blue-500">Pro</span></div>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest">Multi-Slide Editor v4.0</p>
            </div>
            <button onclick="addSlide()" class="bg-blue-600 hover:bg-blue-500 p-2 rounded-lg text-xs font-bold uppercase tracking-tighter transition-colors">
                + Novo Slide
            </button>
        </div>

        <div id="slideTabs" class="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-slate-800">
            </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-tighter">Tema do Slide Atual</label>
                <select id="gradTheme" onchange="updateCurrentSlideData()">
                    <option value="from-blue-600 to-blue-800">Azul (Juros/ROI)</option>
                    <option value="from-emerald-600 to-emerald-800">Verde (Salário/Lucro)</option>
                    <option value="from-indigo-600 to-indigo-800">Índigo (13º/Comissão)</option>
                    <option value="from-orange-600 to-orange-800">Laranja (Horas Extras)</option>
                    <option value="from-rose-600 to-rose-800">Rosa (Parcelamento)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-tighter">Imagem (Individual por slide)</label>
                <input type="file" id="inPhoto" accept="image/*">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-tighter">Título</label>
                <input type="text" id="inLargeTitle" oninput="updateCurrentSlideData()">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-tighter">Conteúdo / Subtítulo</label>
                <textarea id="inSmallTitle" rows="3" oninput="updateCurrentSlideData()"></textarea>
            </div>

            <div class="pt-6 space-y-3">
                <button onclick="downloadPNG()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all uppercase tracking-widest text-xs shadow-lg shadow-blue-900/40">
                    Exportar Slide Atual (PNG)
                </button>
                <button onclick="deleteSlide()" id="btnDelete" class="w-full bg-red-900/30 hover:bg-red-600 text-red-500 hover:text-white py-2 rounded-lg text-[10px] uppercase font-bold transition-all">
                    Excluir este slide
                </button>
            </div>
        </div>
    </aside>

    <main class="viewport-container">
        <div id="instagramPreview">
            <div id="matrixBackground"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#020617] z-[2]"></div>
            
            <header class="absolute top-16 left-20 z-10">
                <div class="fp-title">Ferramentas<span class="text-blue-500">Pro</span></div>
                <div class="h-2 w-48 bg-blue-500 rounded-full mt-2"></div>
            </header>

            <div class="absolute top-[320px] left-20 w-[500px] z-20">
                <h2 id="viewLargeTitle" class="text-[90px] font-black italic leading-[0.9] uppercase tracking-tighter"></h2>
                <p id="viewSmallTitle" class="mt-8 text-2xl text-slate-300 font-medium leading-relaxed"></p>
            </div>

            <div id="photoFrame">
                <img id="previewPhoto" src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=600" class="w-full h-full object-cover grayscale">
                <div id="photoGradOverlay" class="absolute inset-0 opacity-60 bg-gradient-to-br"></div>
            </div>

            <footer class="absolute bottom-16 left-20 right-20 flex justify-between items-center z-10 border-t border-white/10 pt-8">
                <span class="text-2xl font-bold text-slate-500 tracking-[0.3em]">WWW.FERRAMENTASPRO.NET</span>
                <span id="viewPagination" class="text-4xl font-black text-blue-500"></span>
            </footer>
        </div>
    </main>

    <script>
        // ESTADO GLOBAL
        let slides = [
            {
                title: "JUROS COMPOSTOS",
                subtitle: "O guia definitivo para fazer o dinheiro trabalhar por você.",
                theme: "from-blue-600 to-blue-800",
                image: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=600"
            }
        ];
        let currentSlideIndex = 0;

        // INICIALIZAÇÃO
        function init() {
            const matrix = document.getElementById('matrixBackground');
            matrix.innerText = Array.from({length: 4000}, () => Math.floor(Math.random() * 10)).join('');
            renderTabs();
            loadSlide(0);
        }

        // NAVEGAÇÃO
        function renderTabs() {
            const container = document.getElementById('slideTabs');
            container.innerHTML = '';
            slides.forEach((slide, index) => {
                const button = document.createElement('div');
                button.className = `slide-tab min-w-[60px] h-[40px] flex items-center justify-center rounded-lg border border-slate-700 font-bold text-xs ${index === currentSlideIndex ? 'active' : 'bg-slate-800 text-slate-500'}`;
                button.innerText = (index + 1).toString().padStart(2, '0');
                button.onclick = () => loadSlide(index);
                container.appendChild(button);
            });
        }

        function loadSlide(index) {
            currentSlideIndex = index;
            const data = slides[index];
            
            // Atualiza Inputs
            document.getElementById('inLargeTitle').value = data.title;
            document.getElementById('inSmallTitle').value = data.subtitle;
            document.getElementById('gradTheme').value = data.theme;
            document.getElementById('previewPhoto').src = data.image;

            renderTabs();
            updatePreviewUI();
            
            // Esconde botão de deletar se só houver um slide
            document.getElementById('btnDelete').style.display = slides.length > 1 ? 'block' : 'none';
        }

        function addSlide() {
            slides.push({
                title: "NOVO TÍTULO",
                subtitle: "Descrição do conteúdo aqui...",
                theme: "from-blue-600 to-blue-800",
                image: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=600"
            });
            loadSlide(slides.length - 1);
        }

        function deleteSlide() {
            if(slides.length <= 1) return;
            slides.splice(currentSlideIndex, 1);
            currentSlideIndex = Math.max(0, currentSlideIndex - 1);
            loadSlide(currentSlideIndex);
        }

        // SINCRONIZAÇÃO
        function updateCurrentSlideData() {
            slides[currentSlideIndex].title = document.getElementById('inLargeTitle').value;
            slides[currentSlideIndex].subtitle = document.getElementById('inSmallTitle').value;
            slides[currentSlideIndex].theme = document.getElementById('gradTheme').value;
            updatePreviewUI();
        }

        function updatePreviewUI() {
            const data = slides[currentSlideIndex];
            document.getElementById('viewLargeTitle').innerText = data.title;
            document.getElementById('viewSmallTitle').innerText = data.subtitle;
            document.getElementById('viewPagination').innerText = `${(currentSlideIndex + 1).toString().padStart(2, '0')}/${slides.length.toString().padStart(2, '0')}`;
            document.getElementById('photoGradOverlay').className = "absolute inset-0 opacity-60 bg-gradient-to-br " + data.theme;
        }

        // Upload de foto para o slide ativo
        document.getElementById('inPhoto').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('previewPhoto').src = event.target.result;
                slides[currentSlideIndex].image = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // Download PNG
        function downloadPNG() {
            const node = document.getElementById('instagramPreview');
            const originalTransform = node.style.transform;
            node.style.transform = "none";
            
            html2canvas(node, {
                scale: 2,
                backgroundColor: "#020617",
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `ferramentaspro-slide-${currentSlideIndex + 1}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                node.style.transform = originalTransform;
            });
        }

        init();
    </script>
</body>
</html>
